# Enchanted Harnesses - Paper 26.3, Java 25
# Managed by the plugin. Do not change.
config-version: 2

# Exact, case-sensitive world names where riding Happy Ghasts with the speed enchantment is forbidden.
# Happy Ghasts without the speed enchantment can still be ridden in these worlds.
# Example: [world_nether, world_the_end]. Empty allows riding everywhere.
# Restart the server after changing any setting; reload is not supported.
disabled-worlds: []

# Anonymous bStats metrics. Can also be disabled globally in bStats/config.yml.
metrics: true

# Flying speeds, finite values in 0..1. Vanilla riding speed is 0.05.
default-riding-speed: 0.075
idle-speed: 0.01

enchantment:
  enable: true
  # Registry key, lowercase letters, digits and . _ / -
  name: "velocity"
  description: "Velocity"
  # 1..1024
  weight: 3
  # Nonnegative XP costs. Minimum must be positive.
  # Maximum must be >= minimum at every configured level.
  cost:
    anvil: 3
    minimum: 1
    minimum-modifier: 11
    maximum: 15
    maximum-modifier: 10
  # Levels 1..255, speeds in 0..1. At least one level is required.
  levels:
    1: 0.09
    2: 0.1
    3: 0.12
